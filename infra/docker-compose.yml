# Local development stack: PostGIS, MinIO, API, frontend. No Redis, no worker (D-016).
#   docker compose --env-file .env -f infra/docker-compose.yml up -d --build
# scripts/local/dev.ps1 creates .env from infra/.env.example with random passwords.
name: eae

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: eae
      POSTGRES_DB: eae
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eae -d eae"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # MinIO stopped publishing new community images in late 2025; this tag is pinned on purpose.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      EAE_BUCKET: ${EAE_BUCKET:-eae-data}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done;
      mc mb --ignore-existing local/$$EAE_BUCKET;
      echo bucket $$EAE_BUCKET ready"
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      EAE_STORE: sql
      DATABASE_URL: postgresql+psycopg://eae:${POSTGRES_PASSWORD}@db:5432/eae
      DEMO_TOKEN: ${DEMO_TOKEN:?set DEMO_TOKEN in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      EAE_STORAGE_URL: s3://${EAE_BUCKET:-eae-data}
      EAE_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    # Migrations run before the API starts, so `up` yields a database with the schema.
    command: ["sh", "-c", "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - ../data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [backend]

volumes:
  pgdata:
  miniodata:
